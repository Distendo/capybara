[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capybara-ai"
version = "1.3.0"
description = "Local model runner with OpenAI-compatible API and web UI"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
capybara = "capybara:main"

[tool.setuptools]
py-modules = ["capybara"]