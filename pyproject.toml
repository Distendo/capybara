[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capybara-ai"
version = "1.3.1"
description = "Single-file local LLM runner with OpenAI-compatible API and web UI"
requires-python = ">=3.9"
dependencies = []
readme = "README.md"
license = "Apache-2.0"
keywords = ["llama", "llm", "gguf", "openai", "ollama", "local-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Distendo/capybara"
Repository = "https://github.com/Distendo/capybara"

[project.scripts]
capybara = "capybara:main"

[tool.setuptools]
py-modules = ["capybara"]