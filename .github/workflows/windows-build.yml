name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capybara.py'
      - 'server.py'
      - 'gui.py'
      - 'packaging/windows/**'
      - '.github/workflows/windows-build.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests on Windows
        run: python capybara.test.py -v

      - name: Resolve latest llama.cpp engine
        id: engine
        shell: pwsh
        run: |
          # /releases/latest can be a source-only tag (e.g. v0.2.0); scan
          # recent releases and take the newest one that ships a Windows
          # CPU build.
          $rels = Invoke-RestMethod "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=30"
          foreach ($rel in @($rels)) {
            $asset = $rel.assets | Where-Object { $_.name -like "*win-cpu-x64.zip" } | Select-Object -First 1
            if ($asset) {
              "tag=$($rel.tag_name)" >> $env:GITHUB_OUTPUT
              "url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT
              Write-Host "engine asset: $($asset.name) (release $($rel.tag_name))"
              exit 0
            }
          }
          throw "no win-cpu-x64.zip asset found in the last 30 llama.cpp releases"

      - name: Assemble portable package
        shell: pwsh
        env:
          ENGINE_URL: ${{ steps.engine.outputs.url }}
          ENGINE_TAG: ${{ steps.engine.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force stage\bin | Out-Null
          Invoke-WebRequest $env:ENGINE_URL -OutFile engine.zip
          Expand-Archive engine.zip -DestinationPath engtmp
          Get-ChildItem engtmp -Recurse -Include *.exe,*.dll | Move-Item -Destination stage\bin -Force
          Copy-Item capybara.py, server.py, gui.py, README.md, LICENSE -ErrorAction SilentlyContinue stage\
          Copy-Item packaging\windows\capybara.cmd, packaging\windows\capybara-gui.cmd, packaging\windows\README-WINDOWS.txt stage\
          (Get-Content stage\README-WINDOWS.txt) `
            -replace 'see release notes for version', "llama.cpp $env:ENGINE_TAG" |
            Set-Content stage\README-WINDOWS.txt
          Write-Host "staged:"; Get-ChildItem stage | Select-Object Name

      - name: E2E smoke test on Windows
        shell: pwsh
        env:
          CAPYBARA_HOME: ${{ github.workspace }}\cap-home
        run: |
          # pwsh does not fail on native command exit codes by default.
          function Run([string]$cmd) {
            Write-Host ">> $cmd"
            Invoke-Expression $cmd
            if ($LASTEXITCODE -ne 0) { throw "FAILED (exit $LASTEXITCODE): $cmd" }
          }
          Run "python stage/capybara.py --version"
          Run "python stage/capybara.py pull smollm"
          Run "python stage/capybara.py run smollm `"Reply with exactly: WINDOWS OK`""
          Run "python stage/capybara.py ps"
          Run "python stage/capybara.py generate smollm `"2+2=`""
          Run "python stage/capybara.py stop"
          $env:CAPYBARA_HOME = ""
          Run "python stage/capybara.py list"

      - name: Zip package
        shell: pwsh
        run: Compress-Archive -Path stage\* -DestinationPath Capybara-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Capybara-windows-amd64
          path: Capybara-windows-amd64.zip

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Capybara-windows-amd64.zip --clobber
